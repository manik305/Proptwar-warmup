name: 🚀 SafarEngine — Build & Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: balmy-state-495705-q0
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev
  REPO: travel-engine-repo
  BACKEND_SERVICE: safar-backend
  FRONTEND_SERVICE: safar-frontend

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 0: Infrastructure with Terraform
  # ─────────────────────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform Infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'pull_request')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Cloud Resource Manager API
        run: gcloud services enable cloudresourcemanager.googleapis.com --project ${{ env.PROJECT_ID }}

      - name: Create TF State Bucket (if missing)
        run: |
          if ! gsutil ls -b gs://${{ env.PROJECT_ID }}-tfstate > /dev/null 2>&1; then
            gsutil mb -l ${{ env.REGION }} gs://${{ env.PROJECT_ID }}-tfstate
            gsutil versioning set on gs://${{ env.PROJECT_ID }}-tfstate
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: TravelEngine/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: TravelEngine/terraform
        run: terraform apply -auto-approve -var="project_id=${{ env.PROJECT_ID }}" -var="region=${{ env.REGION }}"

  # ─────────────────────────────────────────────────────────
  # JOB 1: Build & push backend image
  # ─────────────────────────────────────────────────────────
  build-backend:
    name: 🐍 Build Backend
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.BACKEND_SERVICE }}:${SHA_SHORT}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        working-directory: TravelEngine/backend
        run: |
          docker build -t ${{ steps.meta.outputs.image }} .
          docker push ${{ steps.meta.outputs.image }}
          # Also tag as latest
          docker tag ${{ steps.meta.outputs.image }} \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.BACKEND_SERVICE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.BACKEND_SERVICE }}:latest

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy backend to Cloud Run
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: ☁️ Deploy Backend
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-backend.outputs.image }}
          flags: |
            --allow-unauthenticated
            --port=8000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --service-account=travel-engine-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --set-secrets=EURI_API_KEY=euri-api-key:latest

      - name: Show backend URL
        run: echo "Backend live at ${{ steps.deploy.outputs.url }}"

  # ─────────────────────────────────────────────────────────
  # JOB 3: Build & push frontend image
  # ─────────────────────────────────────────────────────────
  build-frontend:
    name: ⚛️ Build Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.FRONTEND_SERVICE }}:${SHA_SHORT}"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Build & push frontend image
        working-directory: TravelEngine/frontend
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            -t ${{ steps.meta.outputs.image }} .
          docker push ${{ steps.meta.outputs.image }}
          docker tag ${{ steps.meta.outputs.image }} \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.FRONTEND_SERVICE }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.FRONTEND_SERVICE }}:latest

  # ─────────────────────────────────────────────────────────
  # JOB 4: Deploy frontend to Cloud Run
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-frontend.outputs.image }}
          flags: |
            --allow-unauthenticated
            --port=80
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --service-account=travel-engine-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          env_vars: |
            VITE_BACKEND_URL=${{ needs.deploy-backend.outputs.backend_url }}

      - name: 🎉 Deployment Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ SafarEngine deployed successfully!"
          echo "🌐 Frontend : ${{ steps.deploy.outputs.url }}"
          echo "🐍 Backend  : ${{ needs.deploy-backend.outputs.backend_url }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
